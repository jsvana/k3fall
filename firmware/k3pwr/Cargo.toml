[package]
name = "k3pwr"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "k3pwr"
harness = false

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[features]
default = []

[dependencies]
anyhow = "1"
log = "0.4"
esp-idf-svc = { version = "0.52" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
embuild = "0.33"

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/ethernet_init", version = "*" }
bindings_header = "bindings.h"

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "*" }
