[sdr]
driver = "sdrplay"        # "sdrplay" | "file"
center_hz = 8215000
sample_rate = 250000
gain_db = 40.0
antenna = "Antenna A"

[cat]
enabled = true
device = "/dev/ttyUSB0"
baud = 38400

[dsp]
fft_size = 32768
rows_per_sec = 30
ref_level_db = -30.0
range_db = 90.0

[server]
listen = "0.0.0.0:8080"

# direction: +1 normal, -1 inverted IF spectrum (K3 injection side)
[[bands]]
name = "160m"
low_hz  = 1_800_000
high_hz = 2_000_000
direction = -1
[[bands]]
name = "80m"
low_hz  = 3_500_000
high_hz = 4_000_000
direction = -1
[[bands]]
name = "40m"
low_hz  = 7_000_000
high_hz = 7_300_000
direction = -1
[[bands]]
name = "30m"
low_hz  = 10_100_000
high_hz = 10_150_000
direction = 1
[[bands]]
name = "20m"
low_hz  = 14_000_000
high_hz = 14_350_000
direction = -1
[[bands]]
name = "17m"
low_hz  = 18_068_000
high_hz = 18_168_000
direction = 1
[[bands]]
name = "15m"
low_hz  = 21_000_000
high_hz = 21_450_000
direction = 1
[[bands]]
name = "12m"
low_hz  = 24_890_000
high_hz = 24_990_000
direction = 1
[[bands]]
name = "10m"
low_hz  = 28_000_000
high_hz = 29_700_000
direction = 1
[[bands]]
name = "6m"
low_hz  = 50_000_000
high_hz = 54_000_000
direction = 1

# Remote power control (k3pwr ESP32 on USB). Comment out to disable.
[power]
device = "/dev/ttyACM0"
baud = 115200

# Native Carrier Wave RemoteOp server (pair the iOS app directly with the Pi).
[remoteop]
enabled = true
listen = "0.0.0.0:8474"
name = "k3fall"

# Rig audio from a USB capture device on the K3 line out (RemoteOp radio.audio).
[audio]
enabled = true
device = "plughw:CARD=Device"
sample_rate = 16000
label = "K3 line"
