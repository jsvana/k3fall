[package]
name = "k3fall"
version = "0.1.0"
edition = "2021"

[features]
default = []
soapy = ["dep:soapysdr"]

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
num-complex = "0.4"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
soapysdr = { version = "0.4", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tokio-tungstenite = "0.21"
